<body>

  <header>
    <div class="container header-inner">
      <!-- Logo added here, same as your home page -->
      <h1><a href="index.html"><img src="logo.png" alt="TNT Nanobiotech Logo" class="logo"></a></h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="container page">
      <h2>Contact</h2>
      <p>You can reach us at:</p>
      <p><a href="mailto:m.mousazadeh95@gmail.com">m.mousazadeh95@gmail.com</a></p>
      <p><a href="mailto:m.h.fouani@gmail.com">m.h.fouani@gmail.com</a></p>
      
      <p>You can also contact us on social media using the following ID:</p>
      <!-- I made this a clickable Instagram link assuming @yas_bio_usr is an Instagram handle -->
      <p><a href=>@yas_bio_usr</a></p>

      <!-- Updated form to use your Formspree endpoint -->
      <form class="contact-form" action="https://formspree.io/f/mnpndpvl" method="POST">
        
        <!-- This makes the email subject line nice when you receive the form submission -->
        <input type="hidden" name="_subject" value="New submission from TNT website!">
        
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" placeholder="Your message" required></textarea>

        <button class="btn" type="submit">Send</button>
      </form>
    </section>
  </main>
